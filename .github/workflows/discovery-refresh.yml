name: Discovery refresh validation diagnostic

on:
  push:
    branches: [codex/discovery-refresh-validation]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYRUNS_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Existing discovery, refresh, concurrency, and path regressions
        timeout-minutes: 5
        run: python -X utf8 -u -m pytest -q tests/test_core.py tests/test_web.py tests/test_workspace_path_safety.py --junitxml=test-results/discovery-refresh/pytest.xml
      - name: Compare full first-list requests with fixed directory timestamps
        timeout-minutes: 10
        run: python -X utf8 -u .github/compare_discovery_refresh.py test-results/discovery-refresh 10000
      - name: Preserve diagnostic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-refresh-windows
          path: test-results/
          retention-days: 14
