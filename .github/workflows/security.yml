name: Dependency audit

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  compatibility:
    name: Config compatibility / OmegaConf ${{ matrix.omegaconf }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        omegaconf: ["2.3", "2.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install latest supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "omegaconf~=${{ matrix.omegaconf }}.0"
          python -m pip check
      - name: Verify configuration and startup
        run: |
          mkdir -p test-results
          python -m pytest -q \
            tests/test_config_views.py tests/test_core.py tests/test_task_generator.py \
            tests/test_utils.py::TestYamlIO tests/test_package_imports.py \
            tests/test_dependency_metadata.py \
            tests/test_cli.py::test_cli_dependency_import_failure_is_reported_once \
            --junitxml=test-results/compatibility.xml
      - name: Verify clean installation with latest dependencies
        if: matrix.omegaconf == '2.4'
        run: |
          python -m venv .tmp-install-venv
          .tmp-install-venv/bin/python -m pip install --upgrade pip
          .tmp-install-venv/bin/python -m pip install . "omegaconf~=${{ matrix.omegaconf }}.0"
          .tmp-install-venv/bin/python -m pip check
          .tmp-install-venv/bin/python -I scripts/check_installed_lifecycle.py --output test-results/installed.json
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-omegaconf-${{ matrix.omegaconf }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          pip-audit --progress-spinner off .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        with:
          node-version: 24
      - name: Audit documentation dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=moderate
      - name: Audit frontend dependencies
        if: ${{ !cancelled() }}
        run: npm --prefix frontend audit --audit-level=moderate
