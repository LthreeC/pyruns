name: Windows path boundary prototype

on:
  push:
    branches: [codex/windows-boundary-profile]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate boundary prototype and compare first requests
        timeout-minutes: 12
        run: python -u .github/profile_boundary.py test-results/boundary 10000 --checks
      - name: Preserve comparison and path checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-path-boundary
          path: test-results/boundary/
          retention-days: 14
