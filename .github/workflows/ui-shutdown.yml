name: UI shutdown diagnostic

on:
  push:
    branches: [codex/ui-shutdown-validation]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Observe handoff within the existing full suite
        timeout-minutes: 16
        run: python -X utf8 -u .github/check_ui_shutdown.py --full
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-shutdown-windows
          path: test-results/
          retention-days: 14
