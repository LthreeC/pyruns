name: Task read boundary diagnostic
on:
  push:
    branches: [codex/task-read-boundary]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Check existing contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path audit | Out-Null
          python -m pytest tests/test_workspace_path_safety.py tests/test_utils.py tests/test_core.py tests/test_config_views.py -q --junitxml=audit/pytest.xml > audit/pytest.log 2>&1
          exit $LASTEXITCODE
      - name: Reproduce old project switch defect
        shell: pwsh
        run: |
          python .diagnostics/task_read_boundary.py --negative --output audit/old-regression.json > audit/old-regression.log 2>&1
          exit $LASTEXITCODE
      - name: Compare complete requests on one machine
        shell: pwsh
        run: |
          python .diagnostics/task_read_boundary.py --output audit/comparison.json > audit/comparison.log 2>&1
          exit $LASTEXITCODE
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-read-boundary-windows
          path: audit/
          if-no-files-found: error