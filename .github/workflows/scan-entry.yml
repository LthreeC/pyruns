name: Directory scan validation diagnostic

on:
  push:
    branches: [codex/scan-entry-validation]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYRUNS_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Compare actual directory scan behavior
        run: python -X utf8 -u .github/check_task_scan.py test-results/scan-entry/contracts.json
      - name: Check existing safety and discovery regressions
        run: python -X utf8 -u -m pytest -q tests/test_workspace_path_safety.py tests/test_core.py tests/test_utils.py tests/test_cli.py tests/test_transactional_creation.py -k "reparse or symlink or junction or parallel_directory_scan or scan_disk or task_payload_keeps or task_payload_resolves" --junitxml=test-results/scan-entry/pytest.xml
      - name: Compare directory order with identical source
        run: python -X utf8 -u .github/compare_task_scan.py test-results/order-control 10000 --order-control
      - name: Compare full first-list requests with fixed directory timestamps
        timeout-minutes: 12
        run: python -X utf8 -u .github/compare_task_scan.py test-results/scan-entry 10000
      - name: Preserve diagnostic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scan-entry-windows
          path: test-results/
          retention-days: 14
