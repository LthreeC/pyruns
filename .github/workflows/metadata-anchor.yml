name: Metadata project anchor diagnostic

on:
  push:
    branches: [codex/metadata-anchor-validation]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYRUNS_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify existing metadata, task loading, and path contracts
        timeout-minutes: 5
        run: python -X utf8 -u -m pytest -q tests/test_core.py tests/test_utils.py tests/test_workspace_path_safety.py tests/test_task_generator.py --junitxml=test-results/metadata-anchor/pytest.xml
      - name: Compare native anchors and missing Windows names
        if: always()
        timeout-minutes: 2
        run: python -X utf8 -u .github/check_native_anchors.py test-results/metadata-anchor/native-paths.json
      - name: Compare complete first-list requests on the same fixture
        timeout-minutes: 10
        run: python -X utf8 -u .github/compare_metadata_anchor.py test-results/metadata-anchor 10000
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-anchor-windows
          path: test-results/
          retention-days: 14
