name: File stat diagnostic
on:
  push:
    branches: [codex/file-stat-reuse]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Compare path and payload contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/quality-audit | Out-Null
          python .diagnostics/check_file_stat_contract.py --output .tmp/quality-audit/contracts.json > .tmp/quality-audit/contracts.log 2>&1
          exit $LASTEXITCODE
      - name: Check existing boundary regressions with the prototype
        shell: pwsh
        run: |
          python .diagnostics/check_file_stat_contract.py --tests --output .tmp/quality-audit/tests.json > .tmp/quality-audit/tests.log 2>&1
          exit $LASTEXITCODE
      - name: Compare full task requests
        shell: pwsh
        run: |
          python .diagnostics/check_file_stat_cost.py --output .tmp/quality-audit/comparison.json > .tmp/quality-audit/comparison.log 2>&1
          exit $LASTEXITCODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-stat-windows
          path: .tmp/quality-audit/
          if-no-files-found: error
          retention-days: 14
