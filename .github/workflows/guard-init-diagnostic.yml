name: Native coordination guard initialization

on:
  push:
    branches: [codex/coordination-guard-init]

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install candidate
        run: python -m pip install -e ".[test]"
      - name: Compare real native guard schedules
        run: python .github/check_guard_initialization.py
      - name: Check coordination and real UI handoff
        run: python -m pytest tests/test_self_update.py tests/test_web.py::test_live_web_server_gracefully_hands_idle_update_to_replacer -v -o faulthandler_timeout=30 --junitxml=test-results/guard-init/tests.xml
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordination-guard-init-windows
          path: test-results/guard-init/
          if-no-files-found: error
          retention-days: 14
