name: Windows payload diagnostics

on:
  push:
    branches: [codex/windows-payload-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint]" pytest-github-actions-annotate-failures==0.4.2
      - name: Compare Windows path and handle attributes
        run: python .github/diagnose_payload.py
      - name: Trace backend tests
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $env:PYTHONUNBUFFERED = '1'
          python -u -m pytest tests/test_config_views.py tests/test_web.py -k "payload_snapshot or logs_websocket_idle_queue or default_runtime_partial_task_cache" -vv -o faulthandler_timeout=60 --junitxml=test-results/pytest.xml 2>&1 | Tee-Object -FilePath test-results/pytest-live.log
          exit $LASTEXITCODE
      - name: Preserve test progress and thread stacks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-payload-diagnostic
          path: test-results/
          if-no-files-found: error
          retention-days: 14
