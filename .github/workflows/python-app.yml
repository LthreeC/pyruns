name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint]" pytest-github-actions-annotate-failures==0.4.2
      - name: Lint
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check pyruns scripts --output-format github
          ty check --output-format github --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Test
        if: runner.os != 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p test-results
          python -u -m pytest -v -o faulthandler_timeout=60 --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
      - name: Test Windows
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          python -u -m pytest -v -o faulthandler_timeout=60 --junitxml=test-results/pytest.xml 2>&1 | Tee-Object -FilePath test-results/pytest.log
          exit $LASTEXITCODE
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          python -m pip install -e .
      - name: Test frontend
        run: npm --prefix frontend run test:unit
      - name: Check committed frontend
        run: python scripts/check_frontend_static.py
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test browser
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:e2e
      - name: Check documentation
        if: github.event_name == 'pull_request'
        run: |
          npm ci
          npm run docs:build

  browser:
    name: Browser / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          python -m pip install -e .
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Test browser
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:e2e

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Build and check wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf build .tmp-dist
          python -m build --wheel --outdir .tmp-dist
          python scripts/check_wheel_static.py .tmp-dist/*.whl
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyruns-wheel
          path: .tmp-dist/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  installed-wheel:
    name: Installed wheel / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyruns-wheel
          path: .tmp-dist
      - name: Install and verify wheel
        timeout-minutes: 8
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import venv

          wheel, = Path(".tmp-dist").glob("*.whl")
          environment = Path(".tmp-wheel-venv")
          python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          output = Path("test-results/wheel")
          output.mkdir(parents=True, exist_ok=True)
          (output / "installation.json").write_text(json.dumps({
              "wheel": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "platform": sys.platform,
              "python": str(python.absolute()),
          }, indent=2) + "\n", encoding="utf-8")
          venv.create(environment, with_pip=True)
          subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
          subprocess.run([str(python), "-m", "pip", "check"], check=True)
          subprocess.run([
              str(python), "-I", "scripts/check_installed_lifecycle.py",
              "--output", str(output / "report.json"),
          ], check=True)
      - name: Upload installed task diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-wheel-lifecycle-${{ matrix.os }}
          path: test-results/wheel/
          if-no-files-found: ignore
          retention-days: 14

  scaling:
    name: Scale / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Measure and validate scale workloads
        run: python scripts/benchmark_scaling.py --tasks 1000 10000 --history-steps 100000 500000 --samples 60 --first-samples 3 --read-samples 3 --output test-results/scaling.json
      - name: Upload scale report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scaling-${{ matrix.os }}
          path: test-results/scaling.json
          if-no-files-found: ignore
          retention-days: 14
