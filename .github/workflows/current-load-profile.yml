name: Current first load profile
on:
  push:
    branches: [codex/first-load-current-profile]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Profile current full first request
        run: python .diagnostics/profile_first_list.py
      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-list-5d76ad3-windows
          path: .tmp/quality-audit/first-list-5d76ad3*
          if-no-files-found: error