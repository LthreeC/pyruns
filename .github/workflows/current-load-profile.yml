name: Task batch boundary diagnostic
on:
  push:
    branches: [codex/first-load-current-profile]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Check task loading and boundaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/quality-audit | Out-Null
          python -m pytest tests/test_core.py tests/test_workspace_path_safety.py tests/test_config_views.py -q --junitxml=.tmp/quality-audit/pytest.xml > .tmp/quality-audit/pytest.log 2>&1
          exit $LASTEXITCODE
      - name: Reproduce baseline defects
        shell: pwsh
        run: |
          python .diagnostics/batch_root_boundary.py --negative --output .tmp/quality-audit/old-regression.json > .tmp/quality-audit/old-regression.log 2>&1
          exit $LASTEXITCODE
      - name: Compare complete requests
        shell: pwsh
        run: |
          python .diagnostics/batch_root_boundary.py --output .tmp/quality-audit/comparison.json > .tmp/quality-audit/comparison.log 2>&1
          exit $LASTEXITCODE
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-root-boundary-windows
          path: .tmp/quality-audit/
          if-no-files-found: error