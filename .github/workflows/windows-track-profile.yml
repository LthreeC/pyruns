name: Windows track append profile

on:
  push:
    branches: [codex/windows-track-append-profile]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build current wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir .tmp-profile-dist
      - name: Install and inspect SDK lifecycle stages
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import venv

          wheel, = Path(".tmp-profile-dist").glob("*.whl")
          environment = Path(".tmp-profile-venv")
          python = environment / "Scripts/python.exe"
          output = Path("test-results/track-profile")
          output.mkdir(parents=True, exist_ok=True)
          (output / "installation.json").write_text(json.dumps({
              "wheel": wheel.name, "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "commit": os.environ["GITHUB_SHA"],
          }, indent=2) + "\n", encoding="utf-8")
          venv.create(environment, with_pip=True)
          subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
          subprocess.run([str(python), "-m", "pip", "check"], check=True)
          results = []
          for label, script in (("control", "scripts/check_installed_lifecycle.py"),
                                ("profile", ".github/diagnose_track_stages.py")):
              result = subprocess.run([str(python), "-I", script, "--output", str(output / label / "report.json")])
              results.append(result.returncode)
          assert results == [0, 0], results
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-track-append-profile
          path: |
            test-results/track-profile/
            .tmp-profile-dist/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
