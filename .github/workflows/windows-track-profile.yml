name: Windows track append profile

on:
  push:
    branches: [codex/windows-track-append-profile]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build tool
        run: |
          python -m pip install build
      - name: Compare rollback journals with the installed SDK lifecycle
        run: python .github/compare_track_journals.py --output test-results/rollback-comparison
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-track-journal-comparison
          path: |
            test-results/rollback-comparison/**/*.json
            test-results/rollback-comparison/**/*.log
            test-results/rollback-comparison/*.xml
            test-results/rollback-comparison/wheels/*/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
