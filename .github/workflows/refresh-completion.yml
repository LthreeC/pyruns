name: Refresh completion diagnostic
on:
  push:
    branches: [codex/refresh-completion]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Compare full workspace refreshes
        timeout-minutes: 12
        run: python scripts/benchmark_refresh_completion.py --tasks 10000 --output test-results/refresh/report.json
      - name: Check refresh behavior
        if: always()
        run: python -m pytest -q tests/test_web.py -k "task_refresh_interval or search_api_honors_refresh or partial_task_cache_preserves_refresh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: refresh-completion-windows
          path: test-results/refresh/
          if-no-files-found: error
          retention-days: 14
