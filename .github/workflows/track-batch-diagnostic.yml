name: Durable track batch comparison

on:
  push:
    branches: [codex/track-batch-durable]

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install build
      - name: Verify and compare the installed SDK
        run: python .github/compare_track_batches.py --output test-results/track-batch
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-track-batch-windows
          path: |
            test-results/track-batch/comparison.json
            test-results/track-batch/*.log
            test-results/track-batch/*.xml
            test-results/track-batch/*/report.json
            test-results/track-batch/wheel/*.whl
          if-no-files-found: error
          retention-days: 14
