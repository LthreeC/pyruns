name: Task lock release boundary diagnostic

on:
  push:
    branches: [codex/lock-release-validation]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYRUNS_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e . pytest httpx
      - name: Observe real Windows reader sharing denial
        timeout-minutes: 2
        run: python -X utf8 -u .github/check_task_lock_release.py test-results/lock-release.json
      - name: Existing lock and metric regressions
        timeout-minutes: 5
        run: python -X utf8 -m pytest -q tests/test_track_store.py tests/test_lock_contention.py tests/test_lock_queue.py tests/test_utils.py --junitxml=test-results/pytest.xml
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lock-release-boundary-windows
          path: test-results/
          retention-days: 14
