name: Settings and task name release diagnostic

on:
  push:
    branches: [codex/settings-name-release-validation]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYRUNS_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Observe real Windows delete-sharing denial
        timeout-minutes: 2
        run: python -X utf8 -u .github/check_other_lock_release.py test-results/other-lock-release.json
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: other-lock-release-windows
          path: test-results/
          retention-days: 14
