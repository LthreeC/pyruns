name: Diagnose Windows task lock waits

on:
  push:
    branches: [codex/windows-lock-diagnostic]

permissions:
  contents: read

jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Repeat existing slow-writer regression with failure evidence
        timeout-minutes: 10
        run: python -u .github/diagnose_task_lock.py test-results/lock 15
      - name: Preserve per-process waits and JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-task-lock-waits
          path: test-results/lock/
          retention-days: 14
