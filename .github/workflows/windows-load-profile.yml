name: Windows workspace stat comparison

on:
  push:
    branches: [codex/windows-load-profile]

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYRUNS_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Compare validation results and first task requests
        timeout-minutes: 12
        run: |
          python -u .github/check_workspace_stat_contract.py test-results/first-load/contracts.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u .github/profile_first_load.py test-results/first-load 10000 workspace-stat
      - name: Preserve profile and phase decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-first-load-profile
          path: test-results/first-load/
          retention-days: 14
