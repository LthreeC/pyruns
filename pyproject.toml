[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyruns"
version = "0.2.12"
description = "Git-style CLI and web UI for reproducible Python experiments and terminal workloads."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "LthreeC", email = "lanshiL3C@gmail.com" }]
keywords = [
    "experiment-management",
    "hyperparameter-tuning",
    "task-runner",
    "command-line-interface",
    "monitoring",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=1.10,<3",
    "psutil>=5.9",
    "pyyaml>=5.4",
    "uvicorn>=0.29",
    "websockets>=12,<16",
]

[project.optional-dependencies]
test = [
    "httpx>=0.24,<1",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "tomli>=2,<3; python_version < '3.11'",
]
lint = [
    "flake8>=7,<8",
]
examples = [
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/LthreeC/pyruns"
Repository = "https://github.com/LthreeC/pyruns"
Documentation = "https://lthreec.github.io/pyruns"

[project.scripts]
pyr = "pyruns.cli.app:main"
pyruns = "pyruns.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyruns*"]

[tool.setuptools.cmdclass]
build_py = "pyruns._build.CleanBuildPy"

[tool.setuptools.package-data]
"pyruns" = ["*.css", "**/*.css", "*.html", "**/*.html", "*.js", "**/*.js", "*.txt", "**/*.txt", "*.svg", "**/*.svg"]
